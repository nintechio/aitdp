id: AITDP-TOOL-003
title: SSRF / internal network target in tool arguments
category: tool_abuse
severity: high
confidence: 0.8
stages: [tool_input, retrieved_content, user_input]
description: >
  URLs targeting cloud metadata endpoints, loopback, or private IP ranges in
  HTTP/browsing tool arguments.
references:
  owasp_llm: [LLM06]
  mitre_atlas: [AML.T0053]
  cwe: [CWE-918]
recommended_action: block
patterns:
  - regex: '(?i)https?://(169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200|fd00:ec2::254)'
  - regex: '(?i)https?://(localhost|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0\.0\.0\.0|\[::1\]|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})(:\d+)?'
  - regex: '(?i)(file|gopher|dict|ftp)://'
tests:
  match:
    - "fetch('http://169.254.169.254/latest/meta-data/iam/security-credentials/')"
    - "http://localhost:8080/admin"
    - "browse to http://192.168.1.1/"
    - "file:///etc/passwd"
  no_match:
    - "fetch('https://api.github.com/repos')"
    - "https://example.com/page"
tags: [tool-abuse, ssrf, network]
