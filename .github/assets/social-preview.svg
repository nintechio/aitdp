<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AITDP by Nintech">
  <defs>
    <linearGradient id="brand" x1="330" y1="330" x2="950" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="15" y1="50" x2="49" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="0.65" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#94a3b8" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#060509"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="1080" cy="90" rx="460" ry="320" fill="url(#glowViolet)"/>
  <ellipse cx="150" cy="560" rx="440" ry="300" fill="url(#glowBlue)"/>
  <ellipse cx="1180" cy="620" rx="320" ry="240" fill="url(#glowOrange)"/>

  <!-- pipeline: input -> detectors -> verdict -->
  <g opacity="0.55" fill="none" stroke-linecap="round">
    <path d="M120 470 H1160" stroke="#334155" stroke-width="2"/>
    <path d="M330 470 C 380 470 390 412 440 412 H700" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M640 470 C 690 470 700 528 750 528 H980" stroke="#f97316" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="120" cy="470" r="6.5" fill="#060509" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="330" cy="470" r="6.5" fill="#060509" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="640" cy="470" r="6.5" fill="#060509" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="700" cy="412" r="7" fill="#8b5cf6"/>
    <circle cx="980" cy="528" r="7" fill="#f97316"/>
    <!-- shield node at the end -->
    <path d="M1160 452 L1176 458 V472 C1176 482 1168 489 1160 492 C1152 489 1144 482 1144 472 V458 Z" fill="#060509" stroke="#60a5fa" stroke-width="2.5"/>
    <path d="M1153 471 L1158 476 L1168 465" stroke="#60a5fa" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <g transform="translate(566,74) scale(0.62)">
    <path d="M15 50 L15 27 C15 20.2 17.4 19.11 22.5 23.6 L41.5 40.4 C46.6 44.89 49 43.8 49 37 L49 14"
          fill="none" stroke="url(#markGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="640" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="19" font-weight="700" letter-spacing="6" fill="#f8fafc">NINTECH</text>

  <text x="640" y="322" text-anchor="middle" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="150" font-weight="800" letter-spacing="-4" fill="url(#brand)">AITDP</text>

  <text x="640" y="378" text-anchor="middle" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="32" font-weight="500" fill="#e2e8f0">AI Threat Detection Protocol</text>
  <text x="640" y="412" text-anchor="middle" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="19" font-weight="400" fill="#94a3b8">Open spec · community ruleset · reference SDK — for LLM apps and AI agents</text>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.4">
    <g>
      <rect x="252" y="556" width="200" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#8b5cf6" stroke-opacity="0.4"/>
      <text x="352" y="581" fill="#c4b5fd" text-anchor="middle">PROMPT INJECTION</text>
    </g>
    <g>
      <rect x="466" y="556" width="146" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#60a5fa" stroke-opacity="0.4"/>
      <text x="539" y="581" fill="#7cb8ff" text-anchor="middle">EXFILTRATION</text>
    </g>
    <g>
      <rect x="626" y="556" width="136" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#f97316" stroke-opacity="0.42"/>
      <text x="694" y="581" fill="#fdba74" text-anchor="middle">TOOL ABUSE</text>
    </g>
    <g>
      <rect x="776" y="556" width="252" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="902" y="581" fill="#f8fafc" text-anchor="middle">OWASP LLM · MITRE ATLAS</text>
    </g>
  </g>

  <rect x="0" y="636" width="1280" height="4" fill="url(#hairline)"/>
</svg>
