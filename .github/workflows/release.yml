name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & test
        run: |
          uv pip install --system -e "python[dev]"
          pytest python/tests
          aitdp rules test
      - name: Build
        run: uv build python
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/*
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" python/dist/* --clobber
          else
            gh release create "$tag" python/dist/* --generate-notes --verify-tag
          fi

  publish:
    # Trusted publishing: configured at https://pypi.org/manage/account/publishing/
    # (owner nintechio, repo aitdp, workflow release.yml, environment pypi).
    # Gated on the repository variable PYPI_PUBLISH == "true".
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aitdp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
