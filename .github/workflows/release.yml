name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # PyPI trusted publishing — no API token needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & test
        run: |
          uv pip install --system -e "python[dev]"
          pytest python/tests
          aitdp rules test
      - name: Build
        run: uv build python
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" python/dist/* --generate-notes --verify-tag
      - name: Publish to PyPI
        # Flip the repository variable PYPI_PUBLISH to "true" once trusted publishing
        # is configured at https://pypi.org/manage/account/publishing/ (owner: nintechio,
        # repo: aitdp, workflow: release.yml, environment: pypi).
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
