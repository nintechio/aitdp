name: Changefence

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: changefence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Enforce trusted change policy
        uses: nintechio/changefence@v1
