name: "🙈 False positive / false negative"
description: A rule fired when it shouldn't have, or missed something it should catch
labels: ["rule", "accuracy"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID (if known)
      placeholder: AITDP-INJ-001
  - type: textarea
    id: text
    attributes:
      label: The input
      render: text
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What happened
      options: ["False positive (flagged benign content)", "False negative (missed an attack)"]
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Stage
      placeholder: user_input
